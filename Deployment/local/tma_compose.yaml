version: '3.8'

services:
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "ping"]
        interval: 5s
        timeout: 5s
        retries: 5
    volumes:
     - rabbitmq_data:/var/lib/rabbitmq 

  sql_taskapi:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: "sql_taskapi"
    env_file:
      - .env
    environment:
      SA_PASSWORD: ${SQL_TASKAPI_SA_PASS}
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - mssql_taskapi:/var/opt/mssql      
    healthcheck:
      test: ["CMD-SHELL", "pgrep sqlservr || exit 1"]
      interval: 10s
      timeout: 60s
      retries: 60

  init_taskapi_db:
    image: "mcr.microsoft.com/mssql-tools"
    container_name: "init_taskapi_db"
    depends_on:
      sql_taskapi:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./init-taskapi-db.sh:/init-taskapi-db.sh
    entrypoint: ["/bin/bash", "-c", "chmod +x /init-taskapi-db.sh && /init-taskapi-db.sh"]

  sql_authapi:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: "sql_authapi"
    env_file:
      - .env
    environment:
      SA_PASSWORD: ${SQL_AUTHAPI_SA_PASS}
      ACCEPT_EULA: "Y"
    ports:
      - "1435:1433"
    volumes:
      - mssql_authapi:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "pgrep sqlservr || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  init_authapi_db:
    image: "mcr.microsoft.com/mssql-tools"
    container_name: "init_authapi_db"
    depends_on:
      sql_authapi:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./init-authapi-db.sh:/init-authapi-db.sh    
    entrypoint: ["/bin/bash", "-c", "chmod +x /init-authapi-db.sh && /init-authapi-db.sh"]

  authapi:
    build:
        context: ../../AuthapiSolution/src/AuthApi
        target: final
    depends_on:
      - sql_authapi
      - authapi-migrator
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      ConnectionStrings__Database: "Server=sql_authapi;Database=${SQL_AUTHAPI_DB};User Id=${SQL_AUTHAPI_USER};Password=${SQL_AUTHAPI_PASS};TrustServerCertificate=true;"
      JwtSettings__Secret: "${JWT_SECRET}"

  #EF Core migrations
  authapi-migrator:
      build:
        context: ../../AuthapiSolution/src/AuthApi
        target: migrator
      depends_on:
        sql_authapi:
          condition: service_healthy
        init_authapi_db:
          condition: service_completed_successfully
      env_file:
        - .env
      environment:
        ConnectionStrings__Database: "Server=sql_authapi;Database=${SQL_AUTHAPI_DB};User Id=${SQL_AUTHAPI_EF_USER};Password=${SQL_AUTHAPI_EF_PASS};TrustServerCertificate=true;"
      restart: "no"

  taskapi:
    build: ../../TaskApiSolution
    depends_on:
      - rabbitmq
      - sql_taskapi
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      ConnectionStrings__Database: "Server=sql_taskapi;Database=${SQL_TASKAPI_DB};User Id=${SQL_TASKAPI_USER};Password=${SQL_TASKAPI_PASS};TrustServerCertificate=true;"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      JwtSettings__Secret: "${JWT_SECRET}"

  flyway:
    image: flyway/flyway:latest
    container_name: "flyway"
    depends_on:
      sql_taskapi:
        condition: service_healthy
      init_taskapi_db:
        condition: service_completed_successfully
    volumes:
      - ../../TaskApiSolution/src/TaskApi/migrations:/flyway/sql
    env_file:
      - .env
    environment:
      FLYWAY_URL: "jdbc:sqlserver://sql_taskapi:1433;databaseName=${SQL_TASKAPI_DB};encrypt=true;trustServerCertificate=true"
      FLYWAY_USER: ${SQL_TASKAPI_FLYWAY_USER}
      FLYWAY_PASSWORD: ${SQL_TASKAPI_FLYWAY_PASS}
    command: migrate

  notificationservice:
    build: ../../NotificationSolution/src/NotificationService
    depends_on:
      rabbitmq:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    environment:
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      # web interface port
      - '5080:80'
      # SMTP server port
      - '2525:25'
      # IMAP server port
      - '143:143'
    volumes:
        - smtp4dev-data:/smtp4dev
    environment:      
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

  seq:
    image: datalust/seq:latest
    container_name: "seq"
    ports:
      - "5341:5341" #Http 
      - "8090:80" #web ui
    volumes:
      - ./seq-data:/data
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5341/"]
      interval: 30s
      timeout: 10s
      retries: 5
  

volumes:
  mssql_taskapi:
  mssql_authapi:
  smtp4dev-data:  
  rabbitmq_data: 
  seq-data:  